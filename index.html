<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tern</title>
  </head>
  <body>
    <div id="app">
      <header id="tabbar" data-tauri-drag-region>
        <button id="btn-sidebar" class="icon-btn" title="File tree (Ctrl+B)" data-i18n-title="File tree (Ctrl+B)" aria-pressed="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <div id="tabs" data-tauri-drag-region></div>
        <button id="btn-new" class="icon-btn" title="New tab" data-i18n-title="New tab" aria-haspopup="menu">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="spacer" data-tauri-drag-region></div>
        <button id="btn-tile" class="icon-btn" title="Tabs as windows (Ctrl+Shift+G)" data-i18n-title="Tile all tabs (Ctrl+Shift+G)" aria-pressed="false">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></svg>
        </button>
        <button id="btn-run" class="icon-btn" title="Run the project" data-i18n-title="Run the project">
          <svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Settings (Ctrl+,)" data-i18n-title="Settings (Ctrl+,)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="Light theme" data-i18n-title="Light theme">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <!-- Tern draws its own title bar: these replace the window's own buttons. -->
        <div id="win-controls">
          <button class="wc" data-wc="min" title="Minimize" data-i18n-title="Minimize" tabindex="-1">
            <svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg>
          </button>
          <button class="wc" data-wc="max" title="Maximize" data-i18n-title="Maximize" tabindex="-1">
            <svg class="i-max" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
            <svg class="i-restore" viewBox="0 0 10 10"><rect x="0.5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V0.5h7v7h-2"/></svg>
          </button>
          <button class="wc wc-close" data-wc="close" title="Close" data-i18n-title="Close" tabindex="-1">
            <svg viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg>
          </button>
        </div>
        <div id="new-menu" role="menu" hidden>
          <button role="menuitem" data-kind="claude"><span>Claude</span><kbd>Ctrl+`</kbd></button>
          <button role="menuitem" data-kind="shell"><span data-i18n="Shell">Shell</span><kbd>Ctrl+Shift+T</kbd></button>
        </div>
      </header>
      <aside id="sidebar">
        <div id="tree-head">
          <span id="root-name" title=""></span>
          <button id="btn-search" class="icon-btn" title="Search in files (Ctrl+Shift+F) · Go to file (Ctrl+P)" data-i18n-title="Search in files (Ctrl+Shift+F) · Go to file (Ctrl+P)">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          </button>
          <button id="btn-hidden" class="icon-btn" title="Show hidden files" data-i18n-title="Show hidden files" aria-pressed="false">
            <svg class="i-eye-off" viewBox="0 0 24 24"><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.6 8.6 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M2 2l20 20"/></svg>
            <svg class="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button id="btn-open" class="icon-btn" title="Open another folder" data-i18n-title="Open another folder">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </button>
          <button id="btn-tree-close" class="icon-btn" title="Hide the file tree (Ctrl+B)" data-i18n-title="Hide the file tree (Ctrl+B)">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div id="tree" role="tree"></div>
        <div id="search-view" hidden></div>
      </aside>
      <div id="splitter"></div>
      <div id="center">
        <section id="editor" hidden>
          <header class="ed-head">
            <span class="ed-dot" title="Unsaved changes" data-i18n-title="Unsaved changes"></span>
            <span class="ed-name"></span>
            <span class="ed-dir"></span>
            <button class="ed-mode" title="Switch between text and preview" data-i18n-title="Switch between text and preview" hidden>text</button>
            <button class="ed-close icon-btn" title="Close (Esc)" data-i18n-title="Close (Esc)">
              <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </header>
          <div class="ed-bar" hidden></div>
          <div class="ed-body"></div>
        </section>
        <div id="editor-split"></div>
        <main id="terminal-host">
          <div id="panes"></div>
        </main>
      </div>
    </div>
    <div id="viewer" hidden></div>
    <div id="peek" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
