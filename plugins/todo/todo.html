<style>
  body { padding: 10px 12px; }
  form { display: flex; gap: 6px; margin-bottom: 10px; }
  input[type="text"] {
    flex: 1; min-width: 0; padding: 5px 8px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--panel); color: var(--fg); font: inherit; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button { border: 1px solid var(--accent); border-radius: 4px; background: var(--accent-soft); color: var(--fg); font: inherit; cursor: pointer; padding: 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 4px 2px; border-bottom: 1px solid var(--line); }
  li span { flex: 1; word-break: break-word; }
  li.done span { color: var(--faint); text-decoration: line-through; }
  li input { accent-color: var(--accent); }
  li .del { border: 0; background: none; color: var(--faint); padding: 0 4px; opacity: 0; }
  li:hover .del { opacity: 1; }
  li .del:hover { color: #ff5c7a; }
  .empty, .where { color: var(--dim); font-size: 12px; }
  .where { margin-top: 10px; }
</style>

<form id="add">
  <input type="text" id="text" placeholder="Add a task…" autocomplete="off" />
  <button>+</button>
</form>
<ul id="list"></ul>
<div class="empty" id="empty">Nothing to do.</div>
<div class="where" id="where"></div>

<script>
  const FILE = ".tern/todo.json";
  let items = [];

  async function load() {
    const project = await tern.project();
    document.getElementById("where").textContent = project ? `in ${project.split(/[\\/]/).pop()}/${FILE}` : "Open a project first.";
    const text = project ? await tern.files.read(FILE) : null;
    try {
      items = text ? JSON.parse(text) : [];
    } catch {
      items = [];
    }
    render();
  }

  const save = () => tern.files.write(FILE, JSON.stringify(items, null, 2) + "\n");

  function render() {
    const list = document.getElementById("list");
    list.replaceChildren();
    items.forEach((item, i) => {
      const li = document.createElement("li");
      li.className = item.done ? "done" : "";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = item.done;
      box.onchange = () => { item.done = box.checked; save(); render(); };
      const span = document.createElement("span");
      span.textContent = item.text;
      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.onclick = () => { items.splice(i, 1); save(); render(); };
      li.append(box, span, del);
      list.append(li);
    });
    document.getElementById("empty").hidden = items.length > 0;
  }

  document.getElementById("add").onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById("text");
    const text = input.value.trim();
    if (!text) return;
    items.push({ text, done: false });
    input.value = "";
    save();
    render();
  };

  // Another project opened in Tern: show its list.
  tern.on("project:change", load);
  load();
</script>
