<style>
  * { box-sizing: border-box; }
  body { display: flex; flex-direction: column; height: 100vh; font-size: 12px; }
  header { display: flex; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--line); align-items: center; }
  header button { padding: 3px 10px; border: 0; border-radius: 4px; background: none; color: var(--dim); font: inherit; cursor: pointer; }
  header button.on { background: var(--accent-soft); color: var(--fg); }
  header .branch { margin-left: auto; color: var(--dim); }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .list { overflow: auto; flex: 0 1 auto; max-height: 45%; border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--accent-soft); }
  .row input { margin: 0; accent-color: var(--accent); }
  .code { width: 16px; color: var(--accent); text-align: center; }
  .path { overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  .dim { color: var(--dim); }
  .hash { color: var(--accent); }
  .subject { overflow: hidden; text-overflow: ellipsis; flex: 1; color: var(--fg); }
  pre { flex: 1; min-height: 0; margin: 0; padding: 8px 10px; overflow: auto; font: inherit; line-height: 1.45; white-space: pre; color: var(--fg2); }
  .add { color: #3fb950; } .del { color: #f85149; } .hunk { color: var(--accent); } .meta { color: var(--dim); }
  .commit { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
  textarea { width: 100%; height: 54px; resize: vertical; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); font: inherit; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .buttons { display: flex; gap: 6px; }
  .buttons button { padding: 4px 12px; border: 1px solid var(--line); border-radius: 4px; background: none; color: var(--fg); font: inherit; cursor: pointer; }
  .buttons button.primary { border-color: var(--accent); background: var(--accent-soft); }
  .buttons button:disabled { opacity: 0.4; cursor: default; }
  .empty { padding: 14px 10px; color: var(--dim); }
  .error { color: #f85149; padding: 4px 10px; }
</style>

<header>
  <button id="t-changes" class="on">changes</button>
  <button id="t-history">history</button>
  <span class="branch" id="branch"></span>
</header>
<main id="main"></main>

<script>
  let seq = 0;
  const waiting = new Map();
  const ask = (op, args) =>
    new Promise((resolve, reject) => {
      const req = ++seq + Math.random();
      waiting.set(req, { resolve, reject });
      tern.send({ req, op, args });
    });
  tern.onMessage((m) => {
    if (m && waiting.has(m.re)) {
      const w = waiting.get(m.re);
      waiting.delete(m.re);
      m.error ? w.reject(new Error(m.error)) : w.resolve(m.result);
    } else if (m && m.show === "history") {
      ask("pending").catch(() => {});
      showHistory(m.path);
    }
  });

  const main = document.getElementById("main");
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const tab = (name) => {
    document.getElementById("t-changes").classList.toggle("on", name === "changes");
    document.getElementById("t-history").classList.toggle("on", name === "history");
  };
  const fail = (err) => main.replaceChildren(el("div", "error", String(err.message || err)));

  /** A diff with added / removed lines coloured. */
  function diffView(text) {
    const pre = el("pre");
    for (const line of (text || "").split("\n")) {
      const cls = line.startsWith("+") && !line.startsWith("+++") ? "add"
        : line.startsWith("-") && !line.startsWith("---") ? "del"
        : line.startsWith("@@") ? "hunk"
        : /^(diff|index|commit|Author|Date|---|\+\+\+)/.test(line) ? "meta" : "";
      pre.append(el("span", cls, line + "\n"));
    }
    return pre;
  }

  // ── changes ───────────────────────────────────────────
  async function showChanges() {
    tab("changes");
    let s;
    try {
      s = await ask("status");
    } catch (err) {
      return fail(err);
    }
    document.getElementById("branch").textContent =
      `⎇ ${s.branch}${s.ahead ? " ↑" + s.ahead : ""}${s.behind ? " ↓" + s.behind : ""}`;
    const list = el("div", "list");
    const diff = el("pre");
    diff.className = "dim";
    diff.textContent = s.files.length ? "Click a file to see its changes." : "";
    if (!s.files.length) list.append(el("div", "empty", "Nothing to commit — the working tree is clean."));
    for (const f of s.files) {
      const row = el("div", "row");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = f.staged && !f.changed;
      box.indeterminate = f.staged && f.changed;
      box.title = "Staged for the next commit";
      box.addEventListener("click", async (e) => {
        e.stopPropagation();
        try {
          await ask(box.checked ? "stage" : "unstage", { paths: [f.path] });
        } catch (err) {
          alertLine(err);
        }
        showChanges();
      });
      row.append(box, el("span", "code", f.code), el("span", "path", f.path));
      row.addEventListener("click", async () => {
        for (const r of list.querySelectorAll(".row")) r.classList.remove("sel");
        row.classList.add("sel");
        try {
          const text = await ask("diff", { path: f.path, staged: f.staged && !f.changed, untracked: f.code === "?" });
          const next = diffView(text || "(no text changes)");
          diffNode.replaceWith(next);
          diffNode = next;
        } catch (err) {
          alertLine(err);
        }
      });
      list.append(row);
    }
    let diffNode = diff;
    const commit = el("div", "commit");
    const msg = document.createElement("textarea");
    msg.placeholder = "Commit message";
    const buttons = el("div", "buttons");
    const staged = el("button", "primary", "Commit staged");
    const all = el("button", "", "Commit all");
    const anyStaged = s.files.some((f) => f.staged);
    staged.disabled = !anyStaged;
    all.disabled = !s.files.length;
    const doCommit = async (everything) => {
      try {
        await ask("commit", { message: msg.value, all: everything });
        tern.notify("Committed");
        showChanges();
      } catch (err) {
        alertLine(err);
      }
    };
    staged.addEventListener("click", () => doCommit(false));
    all.addEventListener("click", () => doCommit(true));
    buttons.append(staged, all);
    commit.append(msg, buttons);
    main.replaceChildren(list, diff, commit);
  }

  function alertLine(err) {
    main.querySelector(".error")?.remove();
    main.prepend(el("div", "error", String(err.message || err)));
  }

  // ── history (of the project, or of one file) ─────────
  async function showHistory(path) {
    tab("history");
    let commits;
    try {
      commits = await ask("log", { path });
    } catch (err) {
      return fail(err);
    }
    const list = el("div", "list");
    list.style.maxHeight = "50%";
    if (path) {
      const head = el("div", "row dim", "History of " + path.split(/[\\/]/).pop());
      head.title = path;
      list.append(head);
    }
    if (!commits.length) list.append(el("div", "empty", "No commits yet."));
    let detail = el("pre", "dim", commits.length ? "Click a commit to see what it changed." : "");
    for (const c of commits) {
      const row = el("div", "row");
      row.append(el("span", "hash", c.hash), el("span", "subject", c.subject), el("span", "dim", `${c.author}, ${c.date}`));
      row.addEventListener("click", async () => {
        for (const r of list.querySelectorAll(".row")) r.classList.remove("sel");
        row.classList.add("sel");
        try {
          const next = diffView(await ask("show", { hash: c.hash, path }));
          detail.replaceWith(next);
          detail = next;
        } catch (err) {
          alertLine(err);
        }
      });
      list.append(row);
    }
    main.replaceChildren(list, detail);
  }

  document.getElementById("t-changes").addEventListener("click", showChanges);
  document.getElementById("t-history").addEventListener("click", () => showHistory(null));

  // Opened from the file tree's "Git: file history"? Otherwise, the changes.
  ask("pending")
    .then((p) => (p && p.show === "history" ? showHistory(p.path) : showChanges()))
    .catch(() => showChanges());
</script>
