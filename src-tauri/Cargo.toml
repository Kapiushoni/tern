[package]
name = "tern"
version = "0.3.2"
description = "Fast, minimal terminal workspace for Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "tern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
ignore = "0.4"
which = "7"
notify = "8"
trash = "5"
whisper-rs = "0.16"
cpal = "0.18"
ureq = "3"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
tiny_http = "0.12.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
winreg = "0.55"

# Speech recognition is unusably slow unoptimised, even in dev builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
