[package]
name = "tern"
version = "0.1.0"
description = "Fast, minimal terminal workspace for Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "tern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
ignore = "0.4"
which = "7"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
